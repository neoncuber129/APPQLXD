name: Build APPQLXD WPF

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ==========================================
      # 1. Checkout source code
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Tìm file Solution
      # ==========================================
      - name: Find solution
        id: solution
        shell: pwsh
        run: |
          Write-Host "Searching for .sln file..."

          $solutions = Get-ChildItem `
            -Path . `
            -Filter *.sln `
            -Recurse `
            -File

          if ($solutions.Count -eq 0) {
            Write-Error "No .sln file found."
            exit 1
          }

          Write-Host "Found solution(s):"

          foreach ($solution in $solutions) {
            Write-Host $solution.FullName
          }

          $selected = $solutions | Select-Object -First 1

          Write-Host "Using solution:"
          Write-Host $selected.FullName

          $relativePath = $selected.FullName.Substring(
            (Get-Location).Path.Length + 1
          )

          "path=$relativePath" >> $env:GITHUB_OUTPUT

      # ==========================================
      # 3. Setup .NET
      # ==========================================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ==========================================
      # 4. Hiển thị thông tin .NET
      # ==========================================
      - name: .NET information
        run: |
          dotnet --info

      # ==========================================
      # 5. Restore
      # ==========================================
      - name: Restore
        run: |
          dotnet restore "${{ steps.solution.outputs.path }}"

      # ==========================================
      # 6. Build Release
      # ==========================================
      - name: Build
        run: |
          dotnet build `
            "${{ steps.solution.outputs.path }}" `
            --configuration Release `
            --no-restore

      # ==========================================
      # 7. Tìm WPF project
      # ==========================================
      - name: Find WPF project
        id: wpf
        shell: pwsh
        run: |
          Write-Host "Searching for WPF project..."

          $projects = Get-ChildItem `
            -Path . `
            -Filter *.csproj `
            -Recurse `
            -File

          foreach ($project in $projects) {
            Write-Host ""
            Write-Host "Checking: $($project.FullName)"

            $content = Get-Content $project.FullName -Raw

            if ($content -match "UseWPF") {
              Write-Host "WPF project found:"
              Write-Host $project.FullName

              $relativePath = $project.FullName.Substring(
                (Get-Location).Path.Length + 1
              )

              "path=$relativePath" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }

          Write-Error "No WPF project found."
          exit 1

      # ==========================================
      # 8. Publish WPF
      # ==========================================
      - name: Publish WPF
        shell: pwsh
        run: |
          dotnet publish `
            "${{ steps.wpf.outputs.path }}" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "${{ github.workspace }}\publish"

      # ==========================================
      # 9. Hiển thị file build
      # ==========================================
      - name: Show published files
        shell: pwsh
        run: |
          Write-Host "Published files:"
          Get-ChildItem `
            -Path "${{ github.workspace }}\publish" `
            -Recurse `
            -File |
            Select-Object FullName, Length

      # ==========================================
      # 10. Đóng gói ZIP
      # ==========================================
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ github.workspace }}\publish\*" `
            -DestinationPath "${{ github.workspace }}\APPQLXD-Windows.zip" `
            -Force

      # ==========================================
      # 11. Upload artifact
      # ==========================================
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: APPQLXD-Windows
          path: APPQLXD-Windows.zip
          if-no-files-found: error
