name: Build APPQLXD WPF

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Show repository structure
      - name: Show repository files
        shell: pwsh
        run: |
          Write-Host "Repository structure:"
          Get-ChildItem -Path . -Recurse -File |
            Select-Object FullName

      # 3. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 4. Show .NET information
      - name: .NET information
        run: dotnet --info

      # 5. Find WPF project
      - name: Find WPF project
        id: wpf
        shell: pwsh
        run: |
          Write-Host "Searching for WPF project..."

          $projects = Get-ChildItem `
            -Path . `
            -Filter *.csproj `
            -Recurse `
            -File

          if ($projects.Count -eq 0) {
            Write-Error "No .csproj file found."
            exit 1
          }

          foreach ($project in $projects) {

            Write-Host ""
            Write-Host "Checking:"
            Write-Host $project.FullName

            $content = Get-Content $project.FullName -Raw

            if ($content -match "UseWPF") {

              Write-Host ""
              Write-Host "WPF project found:"
              Write-Host $project.FullName

              $relativePath = $project.FullName.Substring(
                (Get-Location).Path.Length + 1
              )

              "path=$relativePath" >> $env:GITHUB_OUTPUT

              exit 0
            }
          }

          Write-Error "No WPF project found."
          exit 1

      # 6. Restore
      - name: Restore
        run: |
          dotnet restore "${{ steps.wpf.outputs.path }}"

      # 7. Build
      - name: Build Release
        run: |
          dotnet build `
            "${{ steps.wpf.outputs.path }}" `
            --configuration Release `
            --no-restore

      # 8. Publish
      - name: Publish WPF
        shell: pwsh
        run: |
          dotnet publish `
            "${{ steps.wpf.outputs.path }}" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "${{ github.workspace }}\publish"

      # 9. Show published files
      - name: Show published files
        shell: pwsh
        run: |
          Write-Host "Published files:"

          Get-ChildItem `
            -Path "${{ github.workspace }}\publish" `
            -Recurse `
            -File |
            Select-Object FullName, Length

      # 10. Create ZIP
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ github.workspace }}\publish\*" `
            -DestinationPath "${{ github.workspace }}\APPQLXD-Windows.zip" `
            -Force

      # 11. Upload artifact
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: APPQLXD-Windows
          path: APPQLXD-Windows.zip
          if-no-files-found: error
